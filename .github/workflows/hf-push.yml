name: Push datasets to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf/**"
      - "data/benchmark/**"
      - "data/ift/**"
      - ".github/workflows/hf-push.yml"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub[cli]"

      - name: Stage card, stats, and the five option-order files
        run: |
          mkdir -p staging
          cp hf/AraCuisine-Bench/* staging/
          cp data/benchmark/aracuisine_bench_option_order_v*.json staging/

      - name: Upload to dataset root
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload MBZUAI/AraCuisine-Bench staging . \
            --repo-type=dataset \
            --commit-message "Sync from ${{ github.sha }}"

  ift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub[cli]"

      - name: Stage card, stats, and the merged training file
        run: |
          mkdir -p staging
          cp hf/AraCuisine-IFT/* staging/
          # Parts are line-aligned, so decompressing them in order rebuilds the original file
          xz -dc data/ift/arabic_cuisine_sft_data_part*.jsonl.xz > staging/aracuisine_ift.jsonl
          wc -l staging/aracuisine_ift.jsonl

      - name: Upload to dataset root
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload MBZUAI/AraCuisine-IFT staging . \
            --repo-type=dataset \
            --commit-message "Sync from ${{ github.sha }}"
