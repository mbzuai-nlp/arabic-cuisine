name: Push dataset to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf/**"
      - "data/benchmark/**"
      - "data/ift/**"
      - ".github/workflows/hf-push.yml"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub[cli]" pyarrow

      - name: Stage card, benchmark, and IFT data
        run: |
          mkdir -p staging
          cp -r hf/. staging/
          cp data/benchmark/aracuisine_bench_option_order_v*.json staging/bench/
          cp data/benchmark/aracuisine_bench_manifest.tsv staging/bench/
          # Merge the 10 line-aligned parts, in order, into one zstd-compressed Parquet file
          python - <<'EOF'
          import glob, lzma, pyarrow.json as pj, pyarrow.parquet as pq
          parts = sorted(glob.glob("data/ift/arabic_cuisine_sft_data_part*.jsonl.xz"))
          writer, rows = None, 0
          for p in parts:
              with lzma.open(p, "rb") as f:
                  t = pj.read_json(f)
              t = t.select(["instruction", "input", "output", "language"])
              if writer is None:
                  writer = pq.ParquetWriter("staging/ift/aracuisine_ift.parquet", t.schema,
                                            compression="zstd", compression_level=9)
              writer.write_table(t, row_group_size=50_000)
              rows += t.num_rows
          writer.close()
          print("rows:", rows)
          assert rows == 475654, rows
          EOF
          ls -lh staging/ift
          find staging -type f | sort

      - name: Upload to dataset root
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload MBZUAI/AraCuisine staging . \
            --repo-type=dataset \
            --commit-message "Sync from ${{ github.sha }}"
