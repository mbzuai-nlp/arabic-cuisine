name: Push dataset to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf/**"
      - "data/benchmark/**"
      - "data/ift/**"
      - ".github/workflows/hf-push.yml"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub[cli]"

      - name: Stage card, benchmark, and IFT data
        run: |
          mkdir -p staging
          cp -r hf/. staging/
          cp data/benchmark/aracuisine_bench_option_order_v*.json staging/bench/
          cp data/benchmark/aracuisine_bench_manifest.tsv staging/bench/
          # Parts are line-aligned, so decompressing them in order rebuilds the original file
          xz -dc data/ift/arabic_cuisine_sft_data_part*.jsonl.xz > staging/ift/aracuisine_ift.jsonl
          wc -l staging/ift/aracuisine_ift.jsonl
          find staging -type f | sort

      - name: Upload to dataset root
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload MBZUAI/AraCuisine staging . \
            --repo-type=dataset \
            --commit-message "Sync from ${{ github.sha }}"
