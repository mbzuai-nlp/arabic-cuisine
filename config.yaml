# config.yaml
paths:
  lora_out: "models"
  logs_out: "outputs/logs"

train:
  num_train_epochs: 3
  learning_rate: 2.0e-4
  weight_decay: 0.0

  # Effective batch with 8 GPUs = 2 * 8 * 8 = 128
  # (per_device_train_batch_size * gradient_accumulation_steps * num_gpus)
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8

  max_grad_norm: 1.0
  warmup_ratio: 0.03

  # ---------------------------------------------------------------
  # Logging / saving / eval cadence
  # ---------------------------------------------------------------
  # Step-based cadence is preferred for 400k samples because each
  # epoch is long (~2,970 steps at effective batch 128). Epoch-based
  # eval/save would only give 3 datapoints across the whole run, which
  # is too coarse to catch overfitting or recover from a crash.
  logging_steps: 50

  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 5

  eval_split: 0.02            # 0.02 * 400k = 8k eval samples (plenty)
  eval_strategy: "steps"
  eval_steps: 500

  bf16: true
  fp16: false
  gradient_checkpointing: true

  lora_defaults:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: null
    four_bit: true

seed: 42
